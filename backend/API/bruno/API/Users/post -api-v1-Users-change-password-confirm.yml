    description: OK
    request:
      url: "{{baseUrl}}/api/v1/Users/change-password/confirm"
      method: POST
      body:
        type: json
        data: |-
          {
            "code": "123456",
            "newPassword": "NewPassword1"
          }
    response:
      status: 200
      statusText: OK
      body:
        type: json
        data: |-
          {
            "message": "Password changed successfully"
          }


