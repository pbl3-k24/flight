info:
  name: post /api/v1/Users/change-password/confirm
  type: http
  seq: 8
  tags:
    - Users

http:
  method: POST
  url: "{{baseUrl}}/api/v1/Users/change-password/confirm"
  body:
    type: json
    data: |-
      {
        "code": "",
        "newPassword": ""
      }
  auth: inherit

runtime:
